# 依赖更新策略：本项目运行时零网络依赖、产物离线入库。
# 全部依赖精确锁版（含 devDeps，vite 版本影响产物字节），更新以安全修复
# 为先；升级统一由本处 PR 显式发起 + 人工确认，合并后重走完整发布流程
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
